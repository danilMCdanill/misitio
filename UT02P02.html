<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de salario</title>
    <link rel="stylesheet" href="UT02P02.css">
</head>
<body>
    <h1>Cálculo de salario</h1>

    <form action="UT02P02.php" method="post">
        <label for="sueldo">Sueldo (entero mayor de 1000):</label>
        <input type="number" id="sueldo" name="sueldo" min="1001" step="1" required>
        <br><br>

        <label for="puesto">Puesto:</label>
        <select id="puesto" name="puesto" required>
            <option value="base">Base</option>
            <option value="directivo">Directivo</option>
            <option value="alto cargo">Alto cargo</option>
        </select>
        <br><br>

        <input type="submit" value="Calcular">
    </form>
</body>
</html>
